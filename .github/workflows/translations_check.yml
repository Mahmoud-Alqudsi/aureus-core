name: Translations Check

on:
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translations_check:
    runs-on: ubuntu-latest

    name: Check translation files consistency

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code and Translation Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=1 || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD || true)
            
            # 1. Check for translation modifications in any plugin or root
            TRANSLATION_FILES=$(echo "${CHANGED_FILES}" | grep -E '(^|/)lang/|(^|/)resources/lang/' || true)

            # 2. Check for new plugin introduction under plugins/webkul
            NEW_PLUGINS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD || git diff --name-only --diff-filter=A HEAD~1 HEAD || true)
            NEW_PLUGIN_DETECTED=$(echo "${NEW_PLUGINS}" | grep -E '^plugins/webkul/[^/]+/' || true)

            if [ -n "${TRANSLATION_FILES}" ] || [ -n "${NEW_PLUGIN_DETECTED}" ]; then
              echo "run_check=true" >> "$GITHUB_OUTPUT"
              if [ -n "${NEW_PLUGIN_DETECTED}" ]; then
                echo "new_plugin=true" >> "$GITHUB_OUTPUT"
                echo "New plugin package detected in plugins/webkul/. Full translation & audit checks will run."
              else
                echo "new_plugin=false" >> "$GITHUB_OUTPUT"
                echo "Translation files modified. Running plugin-manager translation consistency check."
              fi
            else
              echo "run_check=false" >> "$GITHUB_OUTPUT"
              echo "new_plugin=false" >> "$GITHUB_OUTPUT"
              echo "No translation files modified and no new plugin package added. Skipping translation checks."
            fi
          else
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "new_plugin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.filter.outputs.run_check == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          tools: composer:v2

      - name: Cache Composer dependencies
        if: steps.filter.outputs.run_check == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        if: steps.filter.outputs.run_check == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Setting Environment
        if: steps.filter.outputs.run_check == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run plugin-manager translations consistency check
        if: steps.filter.outputs.run_check == 'true'
        run: php artisan translations:check --details

      - name: Run full UI component localization audit (New Plugin Only)
        if: steps.filter.outputs.new_plugin == 'true'
        run: php scripts/audit-translations.php --check

      - name: Report Skip
        if: steps.filter.outputs.run_check != 'true'
        run: |
          echo "Translation check skipped - no translation files modified and no new plugin introduced."
