name: Playwright Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  aureus_playwright_test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: [8.3]
        node-version: ["22.13.1"]
        shard_index: [1, 2, 3, 4, 5, 6]
        shard_total: [6]
        db: [mysql, pgsql]
        include:
          - db: mysql
            db-label: MySQL
            db-image: mysql:8.0
            db-port: 3306
            db-user: root
            db-password: root
            db-health: mysqladmin ping -h localhost -proot
            php-db-ext: pdo_mysql

          - db: pgsql
            db-label: PostgreSQL
            db-image: postgres:16
            db-port: 5432
            db-user: postgres
            db-password: postgres
            db-health: pg_isready
            php-db-ext: pdo_pgsql

    name: ${{ matrix.db-label }} | Shard ${{ matrix.shard_index }} of ${{ matrix.shard_total }}

    services:
      database:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ matrix.db-password }}
          MYSQL_DATABASE: aureuserp
          POSTGRES_USER: ${{ matrix.db-user }}
          POSTGRES_PASSWORD: ${{ matrix.db-password }}
          POSTGRES_DB: aureuserp
        ports:
          - ${{ matrix.db-port }}:${{ matrix.db-port }}
        options: >-
          --health-cmd="${{ matrix.db-health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=1 || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD || true)
            NON_DOC_FILES=$(echo "${CHANGED_FILES}" | grep -v -E '^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE\.md$|\.md$' || true)
            if [ -n "${CHANGED_FILES}" ] && [ -z "${NON_DOC_FILES}" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
              echo "Documentation-only pull request detected. Skipping heavy Playwright browser tests."
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Composer
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Composer Vendor
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        if: steps.filter.outputs.docs_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, ${{ matrix.php-db-ext }}, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      - name: Set Up Node.js
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tests/e2e-pw/package-lock.json

      - name: Cache Playwright Browsers
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e-pw/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Cache Node Modules
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: tests/e2e-pw/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('tests/e2e-pw/package-lock.json') }}

      - name: Install Node.js Dependencies
        if: steps.filter.outputs.docs_only != 'true'
        run: npm ci
        working-directory: tests/e2e-pw

      - name: Install Playwright Browsers
        if: steps.filter.outputs.docs_only != 'true'
        run: |
          sudo apt-get update --allow-releaseinfo-change
          npx playwright install --with-deps chromium
        working-directory: tests/e2e-pw

      - name: Setting Environment
        if: steps.filter.outputs.docs_only != 'true'
        run: |
          cp .env.example .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1${{ matrix.db }}|" .env
          sed -i "s|^#\?\s*DB_PORT=.*|DB_PORT=${{ matrix.db-port }}|" .env
          sed -i "s|^#\?\s*DB_HOST=.*|DB_HOST=127.0.0.1|" .env
          sed -i "s|^#\?\s*DB_DATABASE=.*|DB_DATABASE=aureuserp|" .env
          sed -i "s|^#\?\s*DB_USERNAME=.*|DB_USERNAME=${{ matrix.db-user }}|" .env
          sed -i "s|^#\?\s*DB_PASSWORD=.*|DB_PASSWORD=${{ matrix.db-password }}|" .env
          sed -i "s|^\(APP_DEBUG=\s*\).*$|\1true|" .env
          sed -i "s|^\(APP_URL=\s*\).*$|\1http://127.0.0.1:8000|" .env
          echo "=== Final .env configuration ==="
          cat .env

      - name: Install Composer
        if: steps.filter.outputs.docs_only != 'true'
        run: composer install --no-scripts --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate APP_KEY (fast, non-Laravel)
        if: steps.filter.outputs.docs_only != 'true'
        run: php artisan key:generate

      - name: Wait for Database to be ready
        if: steps.filter.outputs.docs_only != 'true'
        run: |
          DB_PORT=${{ matrix.db-port }}
          echo "Waiting for ${{ matrix.db-label }} service on 127.0.0.1:${DB_PORT}..."
          for i in {1..30}; do
            if [ "${{ matrix.db }}" = "mysql" ]; then
              mysqladmin ping -h 127.0.0.1 -P ${DB_PORT} -u root -proot --silent 2>/dev/null && READY=1 || READY=0
              DSN="mysql:host=127.0.0.1;port=${DB_PORT};dbname=aureuserp"
              PHP_USER="root"
              PHP_PASS="root"
            else
              PGPASSWORD=${{ matrix.db-password }} pg_isready -h 127.0.0.1 -p ${DB_PORT} -U ${{ matrix.db-user }} >/dev/null 2>&1 && READY=1 || READY=0
              DSN="pgsql:host=127.0.0.1;port=${DB_PORT};dbname=aureuserp"
              PHP_USER="${{ matrix.db-user }}"
              PHP_PASS="${{ matrix.db-password }}"
            fi

            if [ "$READY" = "1" ]; then
              echo "✅ ${{ matrix.db-label }} is up on port ${DB_PORT}!"
              php -r "new PDO('${DSN}', '${PHP_USER}', '${PHP_PASS}');" && echo "✅ PHP can connect!" || echo "❌ PHP cannot connect"
              break
            fi
            echo "⏳ ${{ matrix.db-label }} not ready yet... ($i/30)"
            sleep 3
          done

      - name: Running Aureus Installer
        if: steps.filter.outputs.docs_only != 'true'
        run: |
          php artisan erp:install \
            --force \
            --admin-name="Example" \
            --admin-email="admin@example.com" \
            --admin-password="admin123"

      - name: Start Laravel server
        if: steps.filter.outputs.docs_only != 'true'
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 > server.log 2>&1 &
          echo "Waiting for server to start..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done'

      - name: Run All Playwright Tests
        if: steps.filter.outputs.docs_only != 'true'
        env:
          BASE_URL: "http://127.0.0.1:8000"
        run: |
          npx playwright test --config=playwright.config.ts --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}
        working-directory: tests/e2e-pw

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: steps.filter.outputs.docs_only != 'true' && !cancelled()
        with:
          name: blob-report-${{ matrix.db }}-${{ matrix.shard_index }}
          path: tests/e2e-pw/blob-report
          retention-days: 1

      - name: Upload Failure Artifacts
        uses: actions/upload-artifact@v4
        if: steps.filter.outputs.docs_only != 'true' && failure()
        with:
          name: playwright-failures-${{ matrix.db }}-${{ matrix.shard_index }}-${{ github.run_id }}-${{ github.run_number }}
          path: |
            tests/e2e-pw/test-results
            storage/logs/laravel.log
          retention-days: 1

      - name: Report Documentation-Only Pass
        if: steps.filter.outputs.docs_only == 'true'
        run: |
          echo "Playwright shard skipped successfully - documentation-only pull request."

  merge_playwright_reports:
    if: ${{ always() && !cancelled() }}
    needs:
      - aureus_playwright_test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]

    name: report (${{ matrix.db }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Code Changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} --depth=1 || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || git diff --name-only HEAD~1 HEAD || true)
            NON_DOC_FILES=$(echo "${CHANGED_FILES}" | grep -v -E '^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE\.md$|\.md$' || true)
            if [ -n "${CHANGED_FILES}" ] && [ -z "${NON_DOC_FILES}" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
              echo "Documentation-only pull request detected. Skipping report merge."
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up Node.js
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: tests/e2e-pw/package-lock.json

      - name: Install Node.js Dependencies
        if: steps.filter.outputs.docs_only != 'true'
        run: npm ci
        working-directory: tests/e2e-pw

      - name: Download Blob Reports
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          path: tests/e2e-pw/all-blob-reports
          pattern: blob-report-${{ matrix.db }}-*
          merge-multiple: true

      - name: Merge Playwright Reports
        if: steps.filter.outputs.docs_only != 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: tests/e2e-pw

      - name: Upload HTML Report
        if: steps.filter.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.db }}-${{ github.run_id }}-${{ github.run_number }}
          path: tests/e2e-pw/playwright-report
          retention-days: 1

      - name: Report Documentation-Only Pass
        if: steps.filter.outputs.docs_only == 'true'
        run: |
          echo "Report merge skipped - documentation-only pull request."

  playwright_e2e_gate:
    name: Playwright E2E Gate
    if: ${{ always() }}
    needs:
      - aureus_playwright_test
      - merge_playwright_reports
    runs-on: ubuntu-latest

    steps:
      - name: Require successful test shards and reports
        env:
          SHARD_RESULT: ${{ needs.aureus_playwright_test.result }}
          REPORT_RESULT: ${{ needs.merge_playwright_reports.result }}
        run: |
          test "${SHARD_RESULT}" = "success"
          test "${REPORT_RESULT}" = "success"
